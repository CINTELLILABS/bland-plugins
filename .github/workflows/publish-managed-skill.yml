name: Publish norm-migrate managed skill

# The v2 plugin doubles as the doctrine for Bland's managed migration
# sessions, delivered as an Anthropic custom skill. Publishing a new skill
# version on merge means doctrine changes reach the next migration session
# with no SERVER deploy — the SERVER references the skill at "latest".
on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - "scripts/publish-managed-skill.mjs"
      - ".github/workflows/publish-managed-skill.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22.23.0"
      - name: Publish skill version
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/publish-managed-skill.mjs
